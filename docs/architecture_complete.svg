<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 980" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14598c"/><stop offset="1" stop-color="#0b3d66"/>
    </linearGradient>
    <linearGradient id="orange1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="purple1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- fond -->
  <rect width="1240" height="980" fill="url(#bg1)"/>
  <text x="620" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b3d66">Architecture Complète — GOVIA Cameroun</text>
  <text x="620" y="66" text-anchor="middle" font-size="12" fill="#6b7280">Système agentique bilingue FR/EN · quatre agents : orchestrateur, analyse, recherche (RAG), validation</text>

  <!-- Ligne verticale de séparation infrastructure -->
  <rect x="20" y="95" width="1200" height="850" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="32" y="88" font-size="11" font-weight="bold" fill="#94a3b8">INFRASTRUCTURE — Docker Compose</text>

  <!-- ===== LAYER 1: UTILISATEUR ===== -->
  <rect x="60" y="120" width="1120" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <rect x="60" y="120" width="8" height="52" rx="4" fill="#6b7280"/>
  <text x="80" y="146" font-size="13" font-weight="bold" fill="#1f2937">Utilisateur — Citoyen</text>
  <text x="80" y="164" font-size="11" fill="#6b7280">Navigateur web / PWA · bilingue FR/EN · mobile &amp; desktop</text>
  <text x="1140" y="152" text-anchor="end" font-size="11" fill="#6b7280">📱 Web · PWA</text>

  <!-- arrow -->
  <line x1="620" y1="172" x2="620" y2="192" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 2: FRONTEND ===== -->
  <rect x="60" y="194" width="1120" height="78" rx="8" fill="#ffffff" stroke="#14598c" filter="url(#shadow)"/>
  <rect x="60" y="194" width="8" height="78" rx="4" fill="url(#blue1)"/>
  <text x="80" y="218" font-size="13" font-weight="bold" fill="#0b3d66">FRONTEND — Next.js + React + Tailwind CSS + next-intl</text>
  <text x="80" y="236" font-size="11" fill="#6b7280">App Router · SSR · i18n FR/EN · Design System · Chat · Consentement · Citations · Badge d'audit</text>
  <text x="80" y="254" font-size="10" fill="#94a3b8">Interface citoyen ↔ agent · responsive · accessible (AI Readiness dim. 11)</text>
  <text x="1140" y="232" text-anchor="end" font-size="11" font-weight="bold" fill="#14598c">port 3000</text>

  <!-- arrow -->
  <line x1="620" y1="272" x2="620" y2="292" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 3: API GATEWAY ===== -->
  <rect x="60" y="294" width="1120" height="38" rx="8" fill="#f0f9ff" stroke="#7dd3fc" filter="url(#shadow)"/>
  <text x="80" y="319" font-size="12" font-weight="bold" fill="#0369a1">API Gateway — Routes API Next.js (/api/* rewrite → FastAPI)</text>
  <text x="1140" y="319" text-anchor="end" font-size="11" fill="#0369a1">HTTP · JSON</text>

  <!-- arrow -->
  <line x1="620" y1="332" x2="620" y2="352" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 4: BACKEND ===== -->
  <rect x="60" y="354" width="1120" height="112" rx="8" fill="#ffffff" stroke="#14598c" filter="url(#shadow)"/>
  <rect x="60" y="354" width="8" height="112" rx="4" fill="url(#blue1)"/>
  <text x="80" y="378" font-size="13" font-weight="bold" fill="#0b3d66">BACKEND — FastAPI (Python)</text>

  <!-- 4 agents backend -->
  <rect x="90" y="388" width="255" height="54" rx="6" fill="#e0ecf7" stroke="#14598c"/>
  <text x="217" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d66">Agent orchestrateur</text>
  <text x="217" y="424" text-anchor="middle" font-size="10" fill="#14598c">agent.py · coordination du flux</text>
  <text x="217" y="437" text-anchor="middle" font-size="10" fill="#14598c">rédaction LLM · pré-remplissage</text>

  <rect x="357" y="388" width="255" height="54" rx="6" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="484" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#075985">Agent d'analyse</text>
  <text x="484" y="424" text-anchor="middle" font-size="10" fill="#0369a1">analyse.py · catalogue.py</text>
  <text x="484" y="437" text-anchor="middle" font-size="10" fill="#0369a1">compréhension · classification</text>

  <rect x="624" y="388" width="255" height="54" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="751" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Agent de recherche (RAG)</text>
  <text x="751" y="424" text-anchor="middle" font-size="10" fill="#6d28d9">recherche.py · rag.py</text>
  <text x="751" y="437" text-anchor="middle" font-size="10" fill="#6d28d9">extraction pièces, étapes, citations</text>

  <rect x="891" y="388" width="259" height="54" rx="6" fill="#fef3f2" stroke="#ef4444"/>
  <text x="1020" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Agent de validation</text>
  <text x="1020" y="424" text-anchor="middle" font-size="10" fill="#dc2626">auditor.py · contrôle des sources</text>
  <text x="1020" y="437" text-anchor="middle" font-size="10" fill="#dc2626">conformité · publier / bloquer</text>

  <text x="80" y="458" font-size="10" fill="#94a3b8">Services : privacy.py (masquage) · ocr.py (Tesseract) · journal.py · main.py · endpoints /chat · /kb/search · /upload · /kb/stats</text>

  <!-- arrow vers KB -->
  <line x1="620" y1="466" x2="620" y2="486" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 5: BASE DE CONNAISSANCES ===== -->
  <rect x="60" y="488" width="1120" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" filter="url(#shadow)"/>
  <rect x="60" y="488" width="8" height="58" rx="4" fill="url(#orange1)"/>
  <text x="80" y="512" font-size="13" font-weight="bold" fill="#b45309">Base de Connaissances — JSONL (machine-readable, ouverte)</text>
  <text x="80" y="526" font-size="11" fill="#92400e">256 chunks · 44 documents camerounais · 43 démarches (31 couvertes, 2 partielles, 10 lacunes documentées)</text>
  <text x="80" y="540" font-size="10" fill="#b45309">Identité &amp; état civil · Entreprise · Impôts · Protection sociale · Urbanisme · Foncier · Commerce extérieur · Véhicules · Associations</text>

  <!-- arrow vers services -->
  <line x1="620" y1="546" x2="620" y2="566" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== LAYER 6: SERVICES EXTERNES ===== -->
  <rect x="60" y="568" width="1120" height="62" rx="8" fill="#ffffff" stroke="#7c3aed" filter="url(#shadow)"/>
  <rect x="60" y="568" width="8" height="62" rx="4" fill="url(#purple1)"/>
  <text x="80" y="592" font-size="13" font-weight="bold" fill="#5b21b6">Services Externes (souverain / local — aucune donnée ne sort du Cameroun)</text>

  <!-- 3 boîtes services -->
  <rect x="90" y="600" width="330" height="22" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="255" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Ollama · Mistral 7B (LLM local)</text>

  <rect x="455" y="600" width="330" height="22" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="620" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">ChromaDB · paraphrase-multilingual-MiniLM</text>

  <rect x="820" y="600" width="330" height="22" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="985" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#6d28d9">Tesseract (OCR local · fra+eng)</text>

  <text x="80" y="638" font-size="10" fill="#7c3aed">Conformité Loi 2024/017 art.32 — modèle local, aucune donnée personnelle transférée</text>

  <!-- ===== LAYER 7: CONFORMITE / SECURITE (bandeau) ===== -->
  <rect x="60" y="660" width="1120" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" filter="url(#shadow)"/>
  <rect x="60" y="660" width="8" height="56" rx="4" fill="url(#green1)"/>
  <text x="80" y="684" font-size="13" font-weight="bold" fill="#065f46">Conformité &amp; Sécurité — Loi n° 2024/017 (protection des données)</text>
  <text x="80" y="704" font-size="11" fill="#047857">Consentement explicite · Anonymisation avant ingestion · Données biométriques exclues (art.33) · Citoyen responsable</text>
  <text x="80" y="718" font-size="10" fill="#059669">Mapping Y.3172 · Journal d'audit · Pré-remplissage (citoyen valide &amp; soumet)</text>

  <!-- ===== DASHBOARD DE SUPERVISION ===== -->
  <rect x="60" y="730" width="1120" height="48" rx="8" fill="#f0fdf4" stroke="#34d399" filter="url(#shadow)"/>
  <text x="80" y="754" font-size="12" font-weight="bold" fill="#065f46">Supervision (V2+) — Prometheus · Grafana · Journal d'audit append-only</text>
  <text x="80" y="770" font-size="10" fill="#047857">Métriques : taux de couverture de politique · temps de réponse · taux d'échec de l'auditeur</text>

  <!-- ===== DASHBOARD PARTIE 2 (à gauche, bandeau vertical) ===== -->
  <rect x="60" y="800" width="1120" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="80" y="820" font-size="11" font-weight="bold" fill="#1e40af">PARTIE 2 — Ancrage Réglementaire : base de connaissances (JSONL ouverte) + mapping Y.3172 + analyse d'écarts</text>
  <text x="1140" y="820" text-anchor="end" font-size="11" fill="#1e40af">PARTIE 1 — Solution technique : quatre agents + RAG + démo</text>

  <!-- legende -->
  <rect x="60" y="850" width="1120" height="62" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="80" y="872" font-size="10" font-weight="bold" fill="#6b7280">LÉGENDE :</text>
  <rect x="160" y="862" width="14" height="10" rx="2" fill="url(#blue1)"/><text x="180" y="872" font-size="10" fill="#6b7280">Frontend / Backend</text>
  <rect x="320" y="862" width="14" height="10" rx="2" fill="url(#orange1)"/><text x="340" y="872" font-size="10" fill="#6b7280">Base de connaissances</text>
  <rect x="520" y="862" width="14" height="10" rx="2" fill="url(#purple1)"/><text x="540" y="872" font-size="10" fill="#6b7280">Services externes (souverain)</text>
  <rect x="720" y="862" width="14" height="10" rx="2" fill="url(#green1)"/><text x="740" y="872" font-size="10" fill="#6b7280">Conformité / Sécurité</text>
  <text x="80" y="894" font-size="10" fill="#94a3b8">Architecture V1 (hackathon) — évolutive vers V2 (K8s + Qdrant + Neo4j + PostgreSQL + OIDC) et V3 (vLLM + Ragas + API interopérabilité)</text>
</svg>
