<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
    <linearGradient id="src" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d66"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="citizen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="1240" height="720" fill="url(#bg2)"/>
  <text x="620" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b3d66">Pipeline ITU-T Y.3172 — Flux d'une demande citoyenne</text>
  <text x="620" y="64" text-anchor="middle" font-size="12" fill="#6b7280">SRC → C → PP → M → P → D → SINK · chaque nœud gouverné par une politique réelle</text>

  <!-- ===== CITOYEN ===== -->
  <rect x="440" y="82" width="360" height="54" rx="10" fill="url(#citizen)" filter="url(#shadow2)"/>
  <text x="620" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Citoyen</text>
  <text x="620" y="128" text-anchor="middle" font-size="11" fill="#e0f2fe">Prompt bilingue FR/EN + pièces uploadées</text>
  <line x1="620" y1="136" x2="620" y2="152" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== SRC ===== -->
  <rect x="120" y="156" width="160" height="74" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="120" y="156" width="160" height="20" rx="8" fill="url(#src)"/>
  <text x="200" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SRC</text>
  <text x="200" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">Source de données</text>
  <text x="200" y="210" text-anchor="middle" font-size="9" fill="#6b7280">Prompt citoyen + pièces (images) + base politiques (JSONL)</text>

  <!-- ===== C ===== -->
  <rect x="310" y="156" width="160" height="74" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="310" y="156" width="160" height="20" rx="8" fill="url(#c)"/>
  <text x="390" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">C</text>
  <text x="390" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Collecteur</text>
  <text x="390" y="210" text-anchor="middle" font-size="9" fill="#6b7280">Conversation + OCR pièces + indexation politiques</text>

  <!-- arrow SRC→C -->
  <line x1="280" y1="193" x2="308" y2="193" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== PP ===== -->
  <rect x="500" y="156" width="160" height="74" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="500" y="156" width="160" height="20" rx="8" fill="url(#pp)"/>
  <text x="580" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PP</text>
  <text x="580" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#0284c7">Pré-traitement</text>
  <text x="580" y="210" text-anchor="middle" font-size="9" fill="#6b7280">Nettoyage + détection FR/EN + anonymisation + normalisation</text>

  <!-- arrow C→PP -->
  <line x1="470" y1="193" x2="498" y2="193" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== M ===== -->
  <rect x="690" y="156" width="160" height="74" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="690" y="156" width="160" height="20" rx="8" fill="url(#m)"/>
  <text x="770" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">M</text>
  <text x="770" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">Modèle</text>
  <text x="770" y="210" text-anchor="middle" font-size="9" fill="#6b7280">LLM (Ollama) + RAG (ChromaDB) + extraction d'intention + génération citée</text>

  <!-- arrow PP→M -->
  <line x1="660" y1="193" x2="688" y2="193" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== P — bandeau politique (sous M) ===== -->
  <rect x="120" y="252" width="730" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="120" y="252" width="10" height="46" rx="5" fill="url(#p)"/>
  <text x="140" y="272" font-size="13" font-weight="bold" fill="#b45309">P — Politique (applicable à chaque étape du pipeline)</text>
  <text x="140" y="290" font-size="10" fill="#92400e">Décret 2016/375 (CNI) · Ordonnance 81/02 (état civil) · Loi 2024/017 (protection données) · Loi 92-007 (travail) · etc. — chaque décision de l'agent justifiée par un texte réel</text>

  <!-- ligne reliant M → P -->
  <line x1="770" y1="230" x2="770" y2="250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="780" y="244" font-size="9" fill="#b45309">gouverne</text>

  <!-- ===== D ===== -->
  <rect x="880" y="156" width="160" height="74" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="880" y="156" width="160" height="20" rx="8" fill="url(#d)"/>
  <text x="960" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">D</text>
  <text x="960" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#059669">Distributeur</text>
  <text x="960" y="210" text-anchor="middle" font-size="9" fill="#6b7280">Réponse citée + formulaire pré-rempli + rapport d'audit → citoyen</text>

  <!-- arrow M→D -->
  <line x1="850" y1="193" x2="878" y2="193" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- arrow D→SINK -->
  <line x1="960" y1="230" x2="960" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== SINK ===== -->
  <rect x="820" y="252" width="280" height="46" rx="8" fill="url(#sink)" filter="url(#shadow2)"/>
  <text x="960" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SINK — Cible</text>
  <text x="960" y="290" text-anchor="middle" font-size="10" fill="#dbeafe">Citoyen valide &amp; soumet · Auditeur reçoit le rapport</text>

  <!-- ===== Sous-pipeline : flux 2 agents ===== -->
  <text x="620" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d66">Flux détaillé — Deux agents (GOVIA-Assistant + GOVIA-Auditeur)</text>

  <!-- Assistant box -->
  <rect x="80" y="344" width="460" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow2)"/>
  <text x="310" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">GOVIA-Assistant</text>
  <text x="100" y="390" font-size="10" fill="#6d28d9">▸ Requêtage RAG → citations politiques</text>
  <text x="100" y="408" font-size="10" fill="#6d28d9">▸ Génération réponse citée (articles + références)</text>
  <text x="100" y="426" font-size="10" fill="#6d28d9">▸ Identification procédure + pièces + étapes</text>
  <text x="100" y="444" font-size="10" fill="#6d28d9">▸ Pré-remplissage formulaire (simulation)</text>
  <text x="310" y="458" text-anchor="middle" font-size="9" fill="#a78bfa">produce response + formulaire_prerempli + audit_log</text>

  <!-- arrow Assistant → Auditeur -->
  <line x1="540" y1="404" x2="648" y2="404" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="595" y="396" text-anchor="middle" font-size="9" fill="#6b7280">contrôle</text>

  <!-- Auditeur box -->
  <rect x="660" y="344" width="460" height="120" rx="10" fill="#fef3f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow2)"/>
  <text x="930" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">GOVIA-Auditeur</text>
  <text x="680" y="390" font-size="10" fill="#dc2626">▸ Vérifie chaque réponse vs base de connaissances</text>
  <text x="680" y="408" font-size="10" fill="#dc2626">▸ Détecte les incohérences (procédure vs texte)</text>
  <text x="680" y="426" font-size="10" fill="#dc2626">▸ Bloque/signale si une action n'est pas couverte</text>
  <text x="680" y="444" font-size="10" fill="#dc2626">▸ Produit le verdict : conforme / partiel / non conforme</text>
  <text x="930" y="458" text-anchor="middle" font-size="9" fill="#fca5a5">retourne verdict + gaps → SINK (rapport d'audit)</text>

  <!-- ===== VERSION A vs B ===== -->
  <text x="620" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d66">Bonus — Comparaison Version A (sans gouvernance) vs Version B (gouvernée)</text>

  <rect x="80" y="514" width="540" height="100" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#shadow2)"/>
  <text x="350" y="538" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">Version A — Sans gouvernance</text>
  <text x="100" y="560" font-size="10" fill="#991b1b">▸ Pas de requêtage RAG systématique</text>
  <text x="100" y="578" font-size="10" fill="#991b1b">▸ Réponse non traçable, risque de hallucination</text>
  <text x="100" y="596" font-size="10" fill="#991b1b">▸ Aucune vérification de conformité</text>
  <text x="100" y="614" font-size="10" fill="#991b1b">▸ Conseil potentiellement erroné non contrôlé</text>

  <rect x="620" y="514" width="540" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow2)"/>
  <text x="890" y="538" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Version B — Gouvernante par les politiques</text>
  <text x="640" y="560" font-size="10" fill="#15803d">▸ Requêtage RAG obligatoire, chaque réponse citée</text>
  <text x="640" y="578" font-size="10" fill="#15803d">▸ Journal d'audit + références aux textes</text>
  <text x="640" y="596" font-size="10" fill="#15803d">▸ Auditeur bloque si pas de texte couvrant</text>
  <text x="640" y="614" font-size="10" fill="#15803d">▸ Incohérences détectées, citoyen responsable</text>
</svg>
