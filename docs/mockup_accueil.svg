<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'Source Serif 4', Georgia, serif">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4f9"/></linearGradient>
    <linearGradient id="hdrA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3d66"/><stop offset="1" stop-color="#0f3d70"/></linearGradient>
    <linearGradient id="heroA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3d66"/><stop offset="1" stop-color="#14598c"/></linearGradient>
    <linearGradient id="logoA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14598c"/><stop offset="1" stop-color="#0b3d66"/></linearGradient>
    <filter id="shA" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/></filter>
    <filter id="shCard" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="1240" height="820" fill="url(#bgA)"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="1240" height="62" fill="url(#hdrA)"/>
  <rect x="24" y="12" width="38" height="38" rx="9" fill="url(#logoA)"/>
  <path d="M33 21 L33 41 L40 46 L47 41 L47 21 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M37 26 L37 40 L41 44" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="26" r="2.5" fill="#fbbf24"/>
  <text x="72" y="40" font-size="20" font-weight="bold" fill="#ffffff">GOVIA</text>
  <text x="72" y="54" font-size="10" fill="#93c5fd" font-family="Inter, sans-serif" letter-spacing="2">CAMEROUN</text>
  <text x="620" y="38" text-anchor="middle" font-size="14" fill="#e0f2fe" font-family="Inter, sans-serif">Accueil</text>
  <rect x="1080" y="16" width="56" height="30" rx="15" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="1108" y="36" text-anchor="middle" font-size="12" font-weight="bold" fill="#93c5fd" font-family="Inter, sans-serif">FR / EN</text>

  <!-- ===== HERO ===== -->
  <rect x="24" y="80" width="1192" height="210" rx="16" fill="url(#heroA)" filter="url(#shA)"/>
  <text x="620" y="140" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">Vos démarches administratives,</text>
  <text x="620" y="178" text-anchor="middle" font-size="34" font-weight="bold" fill="#bfdbfe">guidées &amp; justifiées par les textes officiels</text>
  <text x="620" y="218" text-anchor="middle" font-size="15" fill="#dbeafe" font-family="Inter, sans-serif">Un agent d'assistance bilingue (FR/EN) qui identifie la procédure, vérifie les pièces,</text>
  <text x="620" y="240" text-anchor="middle" font-size="15" fill="#dbeafe" font-family="Inter, sans-serif">cite les textes applicables et pré-remplit le formulaire pour vous.</text>

  <rect x="480" y="268" width="280" height="48" rx="10" fill="#ffffff"/>
  <text x="620" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d66" font-family="Inter, sans-serif">Commencer une démarche →</text>
  <rect x="780" y="268" width="120" height="48" rx="10" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="840" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#bfdbfe" font-family="Inter, sans-serif">FR / EN</text>

  <!-- ===== PROCÉDURES / CARDS ===== -->
  <text x="24" y="330" font-size="16" font-weight="bold" fill="#0b3d66">Démarches disponibles</text>
  <text x="24" y="352" font-size="12" fill="#64748b" font-family="Inter, sans-serif">Chaque démarche est gouvernée par un texte réel et ouvert. Cliquez pour être guidé.</text>

  <!-- Carte CNI -->
  <rect x="24" y="370" width="280" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="44" y="388" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="66" y="416" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">🪪</text>
  <text x="100" y="410" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">CNI — Renouvellement</text>
  <text x="100" y="430" font-size="11" fill="#64748b" font-family="Inter, sans-serif">4 étapes · 10 000 FCFA · 48h</text>
  <text x="44" y="456" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Décret 2016/375 · IDCAM</text>
  <text x="240" y="456" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- Carte Passeport -->
  <rect x="330" y="370" width="280" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="350" y="388" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="372" y="416" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">🛂</text>
  <text x="406" y="410" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">Passeport biométrique</text>
  <text x="406" y="430" font-size="11" fill="#64748b" font-family="Inter, sans-serif">5 étapes · 110 000 FCFA · 5 ans</text>
  <text x="350" y="456" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Décret 2021/347 · PassCam</text>
  <text x="546" y="456" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- Carte Acte naissance -->
  <rect x="636" y="370" width="280" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="656" y="388" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="678" y="416" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">📄</text>
  <text x="700" y="410" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">Acte de naissance</text>
  <text x="700" y="430" font-size="11" fill="#64748b" font-family="Inter, sans-serif">2 étapes · délivrance par mairie</text>
  <text x="656" y="456" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Ordonnance 81/02</text>
  <text x="852" y="456" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- Carte Contrat travail -->
  <rect x="942" y="370" width="274" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="962" y="388" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="984" y="416" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">💼</text>
  <text x="1006" y="410" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">Contrat de travail</text>
  <text x="1006" y="430" font-size="11" fill="#64748b" font-family="Inter, sans-serif">CDI/CDD · écrit obligatoire</text>
  <text x="962" y="456" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Loi 92-007 Code du travail</text>
  <text x="1166" y="456" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- 2e rangée -->
  <!-- Carte Carte grise -->
  <rect x="24" y="486" width="280" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="44" y="504" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="66" y="532" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">🚗</text>
  <text x="100" y="526" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">Carte grise</text>
  <text x="100" y="546" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Immatriculation véhicule</text>
  <text x="44" y="572" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Décret 79/341</text>
  <text x="240" y="572" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- Carte Nationalité -->
  <rect x="330" y="486" width="280" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shCard)"/>
  <rect x="350" y="504" width="44" height="44" rx="10" fill="#dbeafe"/>
  <text x="372" y="532" text-anchor="middle" font-size="22" font-family="Inter, sans-serif">🇨🇲</text>
  <text x="406" y="526" font-size="15" font-weight="bold" fill="#1e293b" font-family="Inter, sans-serif">Certificat de nationalité</text>
  <text x="406" y="546" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Délivré par le Tribunal</text>
  <text x="350" y="572" font-size="10" fill="#16a34a" font-family="Inter, sans-serif">Loi 1968-LF-3</text>
  <text x="546" y="572" text-anchor="end" font-size="10" fill="#3b82f6" font-family="Inter, sans-serif">Démarrer →</text>

  <!-- Carte "+ autres" -->
  <rect x="636" y="486" width="280" height="100" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <text x="776" y="532" text-anchor="middle" font-size="22" fill="#94a3b8" font-family="Inter, sans-serif">+ Plus</text>
  <text x="776" y="552" text-anchor="middle" font-size="13" font-weight="bold" fill="#94a3b8" font-family="Inter, sans-serif">11 démarches disponibles</text>
  <text x="776" y="572" text-anchor="middle" font-size="10" fill="#64748b" font-family="Inter, sans-serif">Voir tout →</text>

  <!-- ===== BANDEAU CONFORMITE ===== -->
  <rect x="24" y="608" width="1192" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" filter="url(#shA)"/>
  <rect x="24" y="608" width="6" height="76" rx="3" fill="#10b981"/>
  <text x="44" y="636" font-size="14" font-weight="bold" fill="#065f46">🛡️ Conformité &amp; sécurité</text>
  <text x="44" y="656" font-size="12" fill="#047857" font-family="Inter, sans-serif">Consentement explicite · Données anonymisées · Modèle local (aucune donnée ne sort du Cameroun) · Citoyen responsable</text>
  <text x="44" y="676" font-size="11" fill="#059669" font-family="Inter, sans-serif">Loi n° 2024/017 · Loi n° 2010/012 (cybersécurité) · chaque réponse justifiée par un texte réel</text>

  <!-- ===== FOOTER ===== -->
  <rect x="0" y="700" width="1240" height="120" fill="#0f172a"/>
  <text x="40" y="732" font-size="12" font-weight="bold" fill="#93c5fd" font-family="Inter, sans-serif">GOVIA Cameroun — Agent d'assistance administrative et de conformité</text>
  <text x="40" y="754" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Hackathon ITU AI for Good Lab · Partie 1 (solution technique) + Partie 2 (ancrage réglementaire)</text>
  <text x="40" y="774" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Base de connaissances ouverte · 50 chunks · 11 textes réels camerounais</text>
  <text x="1200" y="732" text-anchor="end" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Version 0.1.0</text>
  <text x="1200" y="754" text-anchor="end" font-size="11" fill="#64748b" font-family="Inter, sans-serif">© 2026 GOVIA</text>
  <text x="1200" y="774" text-anchor="end" font-size="11" fill="#64748b" font-family="Inter, sans-serif">Charte v1.0</text>
</svg>
