name: CI

on:
  push:
  pull_request:

jobs:
  base-et-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_kb.py --check
      - run: pip install fastapi==0.115.0 pydantic==2.9.2 python-multipart==0.0.9 requests==2.32.3 pytest==8.3.3 httpx==0.27.2
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
